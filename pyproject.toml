[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-connectome-pipeline"
version = "1.0.0"
description = "Functional network topology, community structure and robustness analysis"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Isha Vats" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "PyYAML>=6.0,<7",
  "networkx>=3.2,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
brain-connectome-pipeline = "brain_connectome_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
